services:
  - type: web
    name: cu-bot
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: KEEP_ALIVE_ENABLED
        value: "true"
      - key: BOT_KEY
        value: "main"
      - key: SUPABASE_URL
        value: "https://anuuymwfrofbogulsyyr.supabase.co"
      - key: DATA_REFRESH_SECONDS
        value: "120"
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
